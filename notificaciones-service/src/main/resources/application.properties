server.port=${PORT:8083}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.application.name=notificaciones-service

logging.level.root=${LOG_LEVEL:INFO}

smartcash.notificaciones.brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
smartcash.notificaciones.brevo.api-key=${EMAIL_API_KEY:mock-key}
smartcash.notificaciones.remitente.nombre=${EMAIL_REMITENTE_NOMBRE:SmartCash}
smartcash.notificaciones.remitente.email=${EMAIL_REMITENTE:soporte@smartcash.com}

smartcash.frontend.url=${FRONTEND_URL:http://localhost:5173}
smartcash.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}

smartcash.servicios.logs.url=${SMARTCASH_SERVICIOS_LOGS_URL:http://localhost:8085}
smartcash.logs.habilitado=${LOGS_HABILITADO:true}
