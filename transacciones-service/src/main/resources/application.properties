server.port=${PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.application.name=transacciones-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transacciones_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:transacciones_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

logging.level.root=${LOG_LEVEL:INFO}

smartcash.jwt.secret=${SMARTCASH_JWT_SECRET:${JWT_SECRET}}

smartcash.servicios.categorizacion.url=${SMARTCASH_SERVICIOS_CATEGORIZACION_URL:http://localhost:8000}
smartcash.servicios.notificaciones.url=${SMARTCASH_SERVICIOS_NOTIFICACIONES_URL:http://localhost:8083}

smartcash.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}

smartcash.servicios.logs.url=${SMARTCASH_SERVICIOS_LOGS_URL:http://localhost:8085}
smartcash.logs.habilitado=${LOGS_HABILITADO:true}
