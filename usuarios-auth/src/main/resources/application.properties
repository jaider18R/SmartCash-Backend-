server.port=${PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

spring.application.name=usuarios-auth

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usuarios_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:usuarios_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

logging.level.root=${LOG_LEVEL:INFO}

smartcash.jwt.secret=${SMARTCASH_JWT_SECRET:${JWT_SECRET}}
smartcash.jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}

smartcash.servicios.notificaciones.url=${SMARTCASH_SERVICIOS_NOTIFICACIONES_URL:http://localhost:8083}

smartcash.frontend.url=${FRONTEND_URL:http://localhost:5173}
