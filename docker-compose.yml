services:
  postgres-db:
    image: postgres:16-alpine
    container_name: smartcash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartcash-net

  categorizacion-service:
    build:
      context: ./categorizacion-service
      dockerfile: Dockerfile
    image: smartcash/categorizacion-service:1.0.0
    container_name: smartcash-categorizacion
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PY:-*}
      LOG_LEVEL: ${LOG_LEVEL_PY:-info}
      LOGS_SERVICE_URL: http://logs-service:8085
      LOGS_HABILITADO: ${LOGS_HABILITADO:-true}
    volumes:
      - categorizacion_data:/app/data
    networks:
      - smartcash-net

  notificaciones-service:
    build:
      context: ./notificaciones-service
      dockerfile: Dockerfile
    image: smartcash/notificaciones-service:1.0.0
    container_name: smartcash-notificaciones
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      EMAIL_API_KEY: ${EMAIL_API_KEY:-mock-key}
      EMAIL_REMITENTE: ${EMAIL_REMITENTE:-soporte@smartcash.com}
      EMAIL_REMITENTE_NOMBRE: ${EMAIL_REMITENTE_NOMBRE:-SmartCash}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMARTCASH_SERVICIOS_LOGS_URL: http://logs-service:8085
      LOGS_HABILITADO: ${LOGS_HABILITADO:-true}
    networks:
      - smartcash-net

  usuarios-auth:
    build:
      context: ./usuarios-auth
      dockerfile: Dockerfile
    image: smartcash/usuarios-auth:1.0.0
    container_name: smartcash-usuarios-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: usuarios_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      SMARTCASH_JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      SMARTCASH_SERVICIOS_NOTIFICACIONES_URL: http://notificaciones-service:8083
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMARTCASH_SERVICIOS_LOGS_URL: http://logs-service:8085
      LOGS_HABILITADO: ${LOGS_HABILITADO:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres-db:
        condition: service_healthy
      notificaciones-service:
        condition: service_started
    networks:
      - smartcash-net

  transacciones-service:
    build:
      context: ./transacciones-service
      dockerfile: Dockerfile
    image: smartcash/transacciones-service:1.0.0
    container_name: smartcash-transacciones
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/transacciones_db
      SPRING_DATASOURCE_USERNAME: transacciones_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      SMARTCASH_JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      SMARTCASH_SERVICIOS_CATEGORIZACION_URL: http://categorizacion-service:8000
      SMARTCASH_SERVICIOS_NOTIFICACIONES_URL: http://notificaciones-service:8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMARTCASH_SERVICIOS_LOGS_URL: http://logs-service:8085
      LOGS_HABILITADO: ${LOGS_HABILITADO:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres-db:
        condition: service_healthy
      categorizacion-service:
        condition: service_started
    networks:
      - smartcash-net

  analitica-service:
    build:
      context: ./analitica-service
      dockerfile: Dockerfile
    image: smartcash/analitica-service:1.0.0
    container_name: smartcash-analitica
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      TRANSACCIONES_SERVICE_URL: http://transacciones-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PY:-*}
      LOG_LEVEL: ${LOG_LEVEL_PY:-info}
      LOGS_SERVICE_URL: http://logs-service:8085
      LOGS_HABILITADO: ${LOGS_HABILITADO:-true}
    depends_on:
      - transacciones-service
    networks:
      - smartcash-net

  logs-service:
    build:
      context: ./logs-service
      dockerfile: Dockerfile
    image: smartcash/logs-service:1.0.0
    container_name: smartcash-logs
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env}@postgres-db:5432/logs_db
      LOGS_API_KEY: ${LOGS_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PY:-*}
      LOG_LEVEL: ${LOG_LEVEL_PY:-info}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - smartcash-net

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../SmartCash-Frontend-/SmartCash-Frontend/frontend_new}
      dockerfile: Dockerfile
    image: smartcash/frontend:1.0.0
    container_name: smartcash-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - usuarios-auth
      - transacciones-service
      - analitica-service
    networks:
      - smartcash-net

networks:
  smartcash-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  categorizacion_data:
    driver: local
